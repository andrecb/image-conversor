name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            script: make:mac
            artifact: Conversor-de-Imagens-macOS-arm64
            path: out/make/zip/darwin/arm64/*.zip

          - name: macOS universal
            os: macos-14
            script: make:mac:universal
            artifact: Conversor-de-Imagens-macOS-universal
            path: out/make/zip/darwin/universal/*.zip

          - name: Windows x64
            os: windows-latest
            script: make:win
            artifact: Conversor-de-Imagens-Windows-x64
            path: out/make/squirrel.windows/x64/*

          - name: Linux x64
            os: ubuntu-latest
            script: make:linux
            artifact: Conversor-de-Imagens-Linux-x64
            path: |
              out/make/deb/**/*.deb
              out/make/rpm/**/*.rpm
              out/make/zip/linux/**/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
